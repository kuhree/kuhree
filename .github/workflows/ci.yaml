name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    concurrency: flake
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/cachix/install-nix-action@v25
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: check flake
        run: nix flake check --accept-flake-config

      - name: build flake
        run: nix build --accept-flake-config

      - name: upload artifact
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: www-kuhree
          path: result

      - name: Apprise status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          JOB_TITLE: WWW-KUHREE CI
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [ "$JOB_STATUS" = "success" ]; then
            status_emoji="✅"
            notification_type="success"
          else
            status_emoji="❌"
            notification_type="failure"
          fi

          repository_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          run_url="$repository_url/actions/runs/$GITHUB_RUN_NUMBER"
          title="$status_emoji $JOB_TITLE"
          body="$(cat <<EOF
          $status_emoji $JOB_TITLE finished with status: **$JOB_STATUS**

          - **Repository:** [$GITHUB_REPOSITORY]($repository_url)
          - **Ref:** $GITHUB_REF_NAME
          - **Commit:** [${GITHUB_SHA:0:7}]($repository_url/commit/$GITHUB_SHA)
          - **Run:** [$GITHUB_RUN_NUMBER]($run_url)
          EOF
          )"

          curl --fail-with-body --silent --show-error \
            --data-urlencode "title=$title" \
            --data-urlencode "body=$body" \
            --data-urlencode "type=$notification_type" \
            --data-urlencode "format=markdown" \
            https://notify.kuhree.com/notify/notify
