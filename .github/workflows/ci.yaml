name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    concurrency: flake
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: check and build flake
        uses: https://git.kuhree.com/kuhree/actions-flake-ci@v1
        with:
          artifact_name: www-kuhree.zip
          artifact_path: result

      - name: ntfy.sh
        uses: https://git.kuhree.com/kuhree/actions-ntfy@v1
        if: always()
        with:
          token: ${{ secrets.NTFY_API_TOKEN }}
          url: ${{ vars.NTFY_URL }}
          status: ${{ job.status }}
          title: WWW-KUHREE CI
