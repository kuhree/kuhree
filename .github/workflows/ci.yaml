name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # PR runs are keyed by PR number so separate PRs never cancel one another.
  # Main pushes retain their ref and are never canceled.
  group: kuhree-${{ github.event_name == 'pull_request' && github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # v4.4.0
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v25
      - uses: https://github.com/cachix/install-nix-action@6004951b182f8860210c8d6f0d808ec5b1a33d28
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: check flake
        run: nix flake check --accept-flake-config

      - name: build flake
        run: nix build --accept-flake-config

      - name: upload artifact
        # v3
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: www-kuhree
          path: result

      - name: Report Apprise status (best effort)
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          JOB_TITLE: WWW-KUHREE CI
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [ "$JOB_STATUS" = "success" ]; then
            status_emoji="✅"
            notification_type="success"
          else
            status_emoji="❌"
            notification_type="failure"
          fi

          repository_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          run_url="$repository_url/actions/runs/$GITHUB_RUN_NUMBER"
          title="$status_emoji $JOB_TITLE"
          body="$(cat <<EOF
          $status_emoji $JOB_TITLE finished with status: **$JOB_STATUS**

          - **Repository:** [$GITHUB_REPOSITORY]($repository_url)
          - **Ref:** $GITHUB_REF_NAME
          - **Commit:** [${GITHUB_SHA:0:7}]($repository_url/commit/$GITHUB_SHA)
          - **Run:** [$GITHUB_RUN_NUMBER]($run_url)
          EOF
          )"

          curl --fail-with-body --silent --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            --data-urlencode "title=$title" \
            --data-urlencode "body=$body" \
            --data-urlencode "type=$notification_type" \
            --data-urlencode "format=markdown" \
            https://notify.kuhree.com/notify/notify
